name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:

env:
  NODE_VERSION: 26
  PNPM_VERSION: 12
  HEROICONS_VERSION: 2.2.0
  TSX_VERSION: ^4.23.15

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - &checkout
        name: Checkout Repository
        uses: actions/checkout@v7

      - &setup_pnpm
        name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - &setup_node
        name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - &install
        name: Install dependencies
        run: pnpm install --frozen-lockfile

      - &icons_cache
        name: Icons cache
        id: icons-cache
        uses: actions/cache@v6
        with:
          path: src/lib
          key: ${{ runner.os }}-icons-${{ hashFiles('scripts/**/*') }}-heroicons@${{ env.HEROICONS_VERSION }}

      - &install_build_deps
        name: Install build dependencies
        if: steps.icons-cache.outputs.cache-hit != 'true'
        run: pnpm add -D --no-save heroicons@${{ env.HEROICONS_VERSION }} tsx@${{ env.TSX_VERSION }}

      - &build_icons
        name: Build icons
        if: steps.icons-cache.outputs.cache-hit != 'true'
        run: pnpm tsx ./scripts/build.ts

      - name: Check code
        run: pnpm check

  lint:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - *checkout

      - *setup_pnpm

      - *setup_node

      - *install

      - *icons_cache

      - *install_build_deps

      - *build_icons

      - name: Lint code
        run: pnpm lint
