name: Publish to NPM

on:
  push:
    tags: ['v*']

env:
  NODE_VERSION: 26
  PNPM_VERSION: 12

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Icons cache
        id: icons-cache
        uses: actions/cache@v6
        with:
          path: src/lib
          key: ${{ runner.os }}-icons-${{ hashFiles('scripts/**/*') }}
          restore-keys: ${{ runner.os }}-icons-

      - name: Build icons
        if: steps.icons-cache.outputs.cache-hit != 'true'
        run: pnpm tsx ./scripts/build.ts

      # - name: Check code
      #   run: pnpm check

      # - name: Lint code
      #   run: pnpm lint

      - name: Cache prepack
        id: prepack-cache
        uses: actions/cache@v6
        with:
          path: dist
          key: ${{ runner.os }}-prepack-${{ hashFiles('src/lib/**/*') }}
          restore-keys: ${{ runner.os }}-prepack-

      - name: Prepack
        if: steps.prepack-cache.outputs.cache-hit != 'true'
        run: pnpm prepack

      - name: Publish
        run: pnpm publish --no-git-checks
